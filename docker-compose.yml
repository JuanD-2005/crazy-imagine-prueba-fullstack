services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-crazysupporthub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crazysupporthub}
      POSTGRES_DB: ${POSTGRES_DB:-crazysupporthub}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-crazysupporthub}"]
      interval: 5s
      timeout: 5s
      retries: 5

  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    environment:
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: ${N8N_WEBHOOK_BASE_URL:-http://localhost:5678/}
      # El nodo "Send Callback" del workflow (n8n/workflow.json) tiene esta
      # misma URL hardcodeada, no la lee de acá: esta instancia de n8n
      # bloquea el acceso a $env desde expresiones de nodo por defecto. Se
      # deja declarada por si en el futuro se habilita ese acceso y se
      # retoma la referencia por variable.
      BACKEND_CALLBACK_URL: http://backend:3000/webhooks/n8n/enrichment

    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      # "postgres" y "n8n" son los nombres de servicio en la red interna de
      # Docker Compose — no "localhost". Estos dos valores sobreescriben lo
      # que traiga backend/.env (pensado para correr el backend en el host).
      DATABASE_URL: postgresql://${POSTGRES_USER:-crazysupporthub}:${POSTGRES_PASSWORD:-crazysupporthub}@postgres:5432/${POSTGRES_DB:-crazysupporthub}?schema=public
      N8N_WEBHOOK_URL: http://n8n:5678/webhook/ticket-enrichment
      # El watch de nest-cli.json ya fuerza polling; esto es refuerzo por si
      # alguna otra parte del toolchain usa chokidar — bind mounts no siempre
      # propagan eventos de fs nativos de forma confiable.
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
      - /app/src/generated
    depends_on:
      postgres:
        condition: service_healthy
    # El watch mode de @nestjs/cli (`nest start --watch`) mata el child
    # process viejo y levanta el nuevo sin esperar a que libere el puerto, y
    # si ese respawn falla con EADDRINUSE el proceso padre NO muere — se
    # queda vivo sirviendo el código stale del proceso anterior, en silencio
    # (así que ni siquiera un `until` de supervisión externa lo detecta).
    # `start:docker` (tsc --watch compilando a dist/ + nodemon corriendo el
    # JS compilado) reemplaza ese watcher por uno que sí espera la salida
    # completa del proceso antes de reiniciar. Probamos primero nodemon+tsx
    # (sin paso de compilación), pero tsx no preserva los metadatos de
    # decoradores que Nest necesita para inyección de dependencias — un
    # provider con dependencias (p. ej. ConfigService) llegaba undefined.
    command: sh -c "npx prisma migrate deploy && npm run start:docker"

volumes:
  postgres_data:
  n8n_data:
