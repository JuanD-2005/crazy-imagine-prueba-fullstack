name: CI

on:
  push:
    branches:
      - master

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: crazysupporthub
          POSTGRES_PASSWORD: crazysupporthub
          POSTGRES_DB: crazysupporthub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crazysupporthub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://crazysupporthub:crazysupporthub@localhost:5432/crazysupporthub_test?schema=public
      JWT_SECRET: ci-test-secret
      JWT_EXPIRES_IN: 1d
      N8N_WEBHOOK_URL: http://localhost:5678/webhook/ticket-enrichment
      N8N_WEBHOOK_SECRET: ci-test-webhook-secret
      INVITE_CODE: ci-test-invite-code
      PORT: 3000
      CORS_ORIGIN: http://localhost:5173
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run test
      - run: npx prisma migrate deploy
      - run: npx prisma db seed
      - run: npx vitest run --config ./vitest.config.e2e.ts
